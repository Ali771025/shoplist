name: Python checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile shoppingList.py letter_game.py
      - name: Check shopping-list interaction
        run: |
          python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "shoppingList.py"],
              input="Milk\nSHOW\nDONE\n",
              capture_output=True,
              text=True,
              timeout=10,
              check=True,
          )
          assert "Added Milk. List now has 1 items." in result.stdout
          assert "Here's your list:\nMilk" in result.stdout
          print("Shopping-list interaction passed.")
          PY
